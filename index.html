<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><meta name=theme-color content="#0b0d12">
<link rel=manifest href=manifest.json><title>Paper Desk</title>
<style>
*{box-sizing:border-box}body{background:#0b0d12;color:#e6e8ee;font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.sub{color:#8a90a0;font-size:13px}.bal{font-size:52px;font-weight:700;letter-spacing:-1px}.pos{color:#3ddc84}.neg{color:#ff5c5c}.warn{color:#ffb020}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stats div{background:#151922;border-radius:12px;padding:10px 4px;text-align:center;font-size:13px}.stats b{font-size:17px;display:block}
.card{background:#151922;border-radius:14px;padding:14px;margin-top:10px}.new{border:2px solid #2f6bff;animation:p 1.2s 3}@keyframes p{50%{box-shadow:0 0 0 6px #2f6bff55}}
.tk{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:#0b0d12;padding:6px 8px;border-radius:8px;display:inline-block;margin:6px 0;user-select:all}
.big{font-size:22px;font-weight:700}.row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:6px}
.tabs{display:flex;gap:8px;margin-top:18px}.tabs button{flex:1;padding:11px;border:0;border-radius:10px;background:#151922;color:#e6e8ee;font-size:15px}.tabs .on{background:#2f6bff}
.live{background:#3ddc84;color:#000;font-weight:700}.paper{background:#2f6bff;color:#fff;font-weight:700}.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:#222836}h3{margin:18px 0 4px;font-size:15px;color:#8a90a0;font-weight:600}
</style></head><body>
<div class=sub id=mlab>PAPER BALANCE</div><div class=bal id=bal>$—</div><div class=sub id=chg></div>
<div class=stats><div><b id=wr>—</b>Win</div><div><b id=ex>—</b>Exp.</div><div><b id=cl>—</b>Closed</div><div><b id=up>—</b>Unreal.</div></div>
<div class=sub id=src></div><div id=lv></div><div id=wa></div>
<h3>Open positions</h3><div id=openList></div>
<div class=tabs><button id=bh class=on onclick="tab='hist';r()">History</button><button id=bs onclick="tab='sig';r()">Signals</button></div><div id=list></div>
<div class=sub id=upd style="margin-top:14px"></div>
<script>
let tab='hist',hf='all',d,seen=new Set(JSON.parse(localStorage.seen||'[]')),first=!localStorage.seen;
const tm=s=>new Date(s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
const m=(v,p=2)=>(v>=0?'+':'−')+'$'+Math.abs(v).toFixed(p);
async function lvt(k){let key=sessionStorage.lk||prompt('Live admin key (LIVE_ADMIN_KEY or RESTORE_KEY)');if(!key)return;let r=await fetch('/api/live/'+k,{method:'POST',headers:{'X-Admin-Key':key,'Content-Type':'application/json'},body:'{}'});if(r.ok){sessionStorage.lk=key}else alert('Failed: '+r.status);f()}
async function f(){try{d=await(await fetch('/api/status',{cache:'no-store'})).json();r()}catch(e){document.getElementById('upd').textContent='Connection lost, retrying…'}}
function r(){if(!d)return;let LV=d.mode=='live',L0=d.live||{},S=(LV?d.liveStats:d.paperStats)||{winRate:d.winRate,expectancy:d.expectancy,closed:d.closed,unrealizedPnl:d.unrealizedPnl};
document.getElementById('mlab').innerHTML='<span class="pill live">LIVE</span> Kalshi balance (real money)'+(LV?'':' · live paused');
document.getElementById('bal').textContent=d.liveCash!=null?'$'+d.liveCash.toFixed(2):'$—';
document.getElementById('chg').innerHTML=`net deposits (balance minus live P&L) ${d.netDeposits!=null?'$'+d.netDeposits.toFixed(2):'—'} · live P&L since live began <span class=${(d.livePnlSinceStart||0)>=0?'pos':'neg'}>${m(d.livePnlSinceStart||0)}</span>`+`<div style="margin-top:8px;padding:6px 8px;border:1px dashed #888;border-radius:8px;opacity:.85"><span class="pill paper">PAPER (simulated)</span> $${(d.paperBalance??0).toFixed(2)}</div>`;
document.getElementById('wr').textContent=((S.winRate||0)*100).toFixed(0)+'%';document.getElementById('ex').textContent=m(S.expectancy||0);document.getElementById('cl').textContent=S.closed??0;document.getElementById('up').innerHTML=`<span class=${(S.unrealizedPnl||0)>=0?'pos':'neg'}>${m(S.unrealizedPnl||0)}</span>`;
let s=d.signalStatus||{},so=s.sources||{};document.getElementById('src').innerHTML=['coinbase','kalshi','eloedge'].map(k=>`${k}: <span class=${so[k]=='live'?'pos':'warn'}>${so[k]||'?'}</span>`).join(' · ')+(s.fallbackInUse?' · <span class=warn>FALLBACK (Coinbase only)</span>':'');
let al=s.whaleAlerts||[];let cut=Object.entries(s.signals||{}).filter(([a,g])=>g.whale).map(([a,g])=>`${a} $${Math.round(g.whale.thresholdUsd/1000)}k`).join(' · ');
document.getElementById('wa').innerHTML='<div class=card><b>🐋 Whale alerts (60s)</b><div class=sub>Cutoff (adapts to volume; BTC $100–150k, ETH $35–60k, SOL $25–45k; n/a for gold/silver): '+(cut||'—')+'</div>'+al.slice(0,5).map(w=>`<div class=row><span>${w.asset} <b class=${w.side=='buy'?'pos':'neg'}>${w.side.toUpperCase()}</b> $${Math.round(w.usd/1000)}k @ ${w.price}</span><span class=sub>${w.ago}s ago</span></div>`).join('')+(al.length?'':'<div class=sub>No whale trades in the last 60s.</div>')+'</div>';
let o=(d.trades||[]).filter(t=>!t.shadow).filter(t=>t.status=='open');
let L=d.live||{};let SH=d.shadowStats||{};let shl=Object.keys(SH).map(k=>{let x=SH[k];return `<div class=sub>👻 ${k} (paper only): ${x.closed||0} closed, ${((x.winRate||0)*100).toFixed(0)}% win, ${m(x.pnl||0)}, ${x.open||0} open</div>`}).join('');document.getElementById('lv').innerHTML=`<details class=card><summary class=sub>Shadow lines (not real money)</summary>${shl}</details>`+(L.envAllow&&L.keysPresent)?`<div class=card><div class=row><b>⚡ Live: <span class=${L.enabled?'pos':'warn'}>${L.enabled?'ON':'PAUSED'}</span></b><span><button onclick="lvt('toggle')">${L.paused?'Resume live':'Pause live'}</button> <button onclick="lvt('reset')">Reset kill switch</button></span></div><div class=sub>Kalshi $${L.cash!=null?L.cash.toFixed(2):'—'} · live today ${m(L.todayPnl||0)} · ${(d.liveStats||{}).closed||0} live trades closed, ${(((d.liveStats||{}).winRate||0)*100).toFixed(0)}% win, ${m((d.liveStats||{}).pnl||0)}${L.killSwitch&&L.killSwitch.tripped?' · <span class=neg>KILL SWITCH: '+L.killSwitch.reason+'</span>':''}${L.ws?' · ws: <span class='+(L.ws.connected?'pos>live':'warn>off')+'</span>':''}${L.lastError?' · <span class=warn>'+L.lastError+'</span>':''}</div>${(L.recentOrders||[]).slice(0,3).map(x=>`<div class=sub>${x.action} ${x.side||''} ${(x.ticker||'').split('-')[0]} ${x.filled!=null?x.filled+'@'+(x.fillPrice!=null?(+x.fillPrice).toFixed(2):'—'):''}${x.pnl!=null?' '+m(x.pnl):''} ${x.error||''}</div>`).join('')}</div>`:'';

const N=(v,p)=>(typeof v=='number'&&isFinite(v))?v.toFixed(p):(v??'—');
const left=t=>{let x=Math.round((t.closesAt||0)-Date.now()/1000);return x<=0?'closing':Math.floor(x/60)+'m '+String(x%60).padStart(2,'0')+'s left'};
const card=t=>{let isNew=!seen.has(t.id)&&!first,u=t.unrealizedPnl,w=t.whaleFlowUsd;return `<div class="card ${isNew?'new':''}" style="border-left:4px solid ${t.flipWarning||t.whaleAgainst?'#ffb020':'#2f6bff'}">
<div class=row><span class=big>${t.mode=='live'?'<span class="pill live">LIVE</span> ':''}${t.asset||''} ${t.side||''}${t.exiting?' <span class="pill warn">selling…</span>':''}</span><span class=big style="color:#e6e8ee">${left(t)}</span></div>
<div class=tk>${t.ticker||'—'}</div>
<div class=row><span>Entry <b>${N(t.price,3)}</b></span><span>Mark <b>${N(t.markPrice,3)}</b></span><span>P&L <b class=${(u||0)>=0?'pos':'neg'}>${typeof u=='number'?m(u):'—'}</b></span></div>
<div class=row><span>Stake <b>$${N(t.stake,2)}</b>${t.stakePct!=null?' ('+t.stakePct+'% bal)':''}</span><span>Edge ${typeof t.edge=='number'?(t.edge*100).toFixed(1)+'%':'—'}</span><span class=sub>opened ${t.openedAt?tm(t.openedAt):'—'}</span></div>
<div class=row>${t.flipWarning?'<span class="pill warn">⚠ signals flipping against</span>':t.signalsAgree?'<span class="pill pos">signals agree</span>':'<span class=pill>mixed</span>'}<span class=${t.whaleAgainst?'warn':'sub'}>🐋 ${typeof w=='number'?(w>=0?'+':'−')+'$'+Math.round(Math.abs(w)/1000)+'k for position':'no whale data'}${t.whaleAgainst?' · AGAINST':''}</span></div></div>`};
document.getElementById('openList').innerHTML=o.length?o.map(t=>{try{return card(t)}catch(e){return `<div class=card><b>${t.asset} ${t.side}</b> <span class=tk>${t.ticker||''}</span><br><span class=sub>entry ${t.price} · stake $${t.stake}</span></div>`}}).join(''):'<p class=sub>No open positions right now.</p>';
o.forEach(t=>seen.add(t.id));first=false;localStorage.seen=JSON.stringify([...seen]);
document.getElementById('bh').className=tab=='hist'?'on':'';document.getElementById('bs').className=tab=='sig'?'on':'';
if(tab=='hist')document.getElementById('list').innerHTML='<a href="/api/trades.csv" download style="display:block;text-align:center;margin-top:10px;padding:11px;border-radius:10px;background:#2f6bff;color:#fff;text-decoration:none;font-weight:600">Export CSV</a><div class=tabs>'+['all','live','paper'].map(k=>`<button class=${hf==k?'on':''} onclick="hf='${k}';r()">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')+'</div>'+(d.trades||[]).filter(t=>!t.shadow).filter(t=>t.status!='open'&&(hf=='all'||(hf=='live')==(t.mode=='live'))).map(t=>`<div class=card><div class=row><b><span class="pill ${t.mode=='live'?'live':'paper'}">${t.mode=='live'?'LIVE':'PAPER'}</span> ${t.asset} ${t.side} @ ${t.price}</b><b class=${t.pnl>=0?'pos':'neg'}>${m(t.pnl)}</b></div>
<div class=sub>${t.ticker||'demo'} · $${t.stake} · ${t.status.toUpperCase()}${t.exitReason?' · '+t.exitReason:''} · ${t.settledBy||''} · ${t.closedAt?tm(t.closedAt):''}</div></div>`).join('')||'<p class=sub>No closed trades yet.</p>';
else document.getElementById('list').innerHTML=Object.entries(s.signals||{}).map(([a,g])=>`<div class=card><b>${a}</b> · mom ${((g.momentum||0)*100).toFixed(2)}% · CVD ${g.cvd} · ${g.direction||''} · p ${g.modelP??'–'}<br><span class=sub>${g.kalshi?g.kalshi.ticker+' · YES '+g.kalshi.yesBid+'/'+g.kalshi.yesAsk+' · NO '+g.kalshi.noBid+'/'+g.kalshi.noAsk:''}<br>🐋 ${g.whale?`${g.whale.count} whale trades ≥ $${Math.round(g.whale.thresholdUsd/1000)}k · net ${(g.whale.netFlowUsd>=0?'+':'−')}$${Math.round(Math.abs(g.whale.netFlowUsd)/1000)}k${g.whale.strongDir?' · strong '+g.whale.strongDir:''}`:'—'}<br>${g.action||''}</span></div>`).join('')+(()=>{let e=d.earlyExits;if(!e||!e.all.count)return '';const r=(k,a)=>`<div class=row><span>${k}: ${a.count} exits · ${a.wouldHaveWon}/${a.resolved} would have won</span><b class=${a.netSaved>=0?'pos':'neg'}>${m(a.netSaved)}</b></div><div class=sub>exit P&L ${m(a.exitPnl)} vs hold ${m(a.holdPnl)} · saved on losers ${m(a.savedOnLosers)} · gave up on winners ${m(a.lostOnWinners)}</div>`;return '<div class=card><b>Early-exit review</b>'+r('All',e.all)+Object.entries(e.byReason).map(([k,a])=>r(k,a)).join('')+(e.pending?`<div class=sub>${e.pending} awaiting Kalshi result</div>`:'')+'<div class=sub>Net = exit P&L minus what holding to settlement would have paid.</div></div>'})()+`<p class=sub>${s.signalMode||''}<br>${s.rules||''}</p>`;
document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString()+' · tick '+(s.lastTick?tm(s.lastTick):'—')}
f();setInterval(f,3000)
</script></body></html>
